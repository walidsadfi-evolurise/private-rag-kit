[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "private-rag-kit"
version = "0.1.0"
description = "Self-hosted retrieval-augmented generation over private documents: hybrid search, mandatory citations, refusal when the sources are missing, and an evaluation loop."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Walid Sadfi", email = "walid.sadfi@evolurise.com" }]
requires-python = ">=3.11"
keywords = ["rag", "retrieval", "llm", "pgvector", "private", "self-hosted", "evals"]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "rank-bm25>=0.2.2",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.3", "sqlalchemy>=2.0"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
rag = "ragkit.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM"]
per-file-ignores = { "src/ragkit/cli.py" = ["B008"] }

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
packages = ["ragkit"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
